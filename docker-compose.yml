# PostgreSQL for the VoiceDrift backend.
#   Start:  docker compose up -d db        Stop:  docker compose stop db
#   Wipe all data (accounts, linked phones, results):  docker compose down -v
# The user, password, database name and port come from .env (see .env.example).
name: voicedrift

services:
  db:
    image: postgres:17-alpine
    container_name: voicedrift-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # this laptop only, never the Wi-Fi
    volumes:
      - voicedrift-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  voicedrift-db:
